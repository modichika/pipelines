name: AI Issue Quality Analyzer
on:
  issues:
    types: [opened]

concurrency:
  group: ai-triage-queue
  cancel-in-progress: false 

env:
  TARGET_MODEL: "qwen2.5:7b"

jobs:
  analyze-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests

      - name: Validate Issue Title
        run: |
          python -c '
          import os, re, sys, subprocess
          title = os.getenv("TITLE", "")
          issue_num = os.getenv("ISSUE_NUMBER")
          token = os.getenv("GITHUB_TOKEN")
          github_output_path = os.getenv("GITHUB_OUTPUT")
          
          pattern = r"^([a-z]+)\(([a-z]+)\):\s*(.+)$"
          if not re.match(pattern, title.strip()):
              print("❌ Title format invalid.")
              # Post comment to the issue before exiting
              error_msg = (
                  "🤖 **AI Issue Quality Review**\n\n"
                  "⚠️ **Validation Failed:** Issue title must follow the correct format: "
                  "`<type>(<area>): <title contents>` where type is `bug`, `chore`, or `feature`."
              )
              subprocess.run(["gh", "issue", "comment", issue_num, "--body", error_msg], env={**os.environ, "GH_TOKEN": token})
              with open(github_output, "a") as f:
                  f.write("valid=false\n")
              sys.exit(0)
          else:
              print("✅ Title format valid.")
              with open(github_output, "a") as f:
                  f.write("valid=true\n")
          '
        env:
          TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up and Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull ${{ env.TARGET_MODEL }}

      - name: Execute AI Issue Triage
        id: ai_logic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.issue.title }}
          RAW_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_MODEL: ${{ env.TARGET_MODEL }}
        run: python .github/scripts/ai_triage.py

      - name: Apply Quality Analysis Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPORT: ${{ steps.ai_logic.outputs.analysis }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "## 🤖 AI Issue Quality Review
          $REPORT"