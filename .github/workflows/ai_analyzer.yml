name: AI Issue Triage Agent
on:
  issues:
    types: [opened]

jobs:
  validate-title:
    runs-on: ubuntu-latest
    outputs:
      is_valid: ${{ steps.check.outputs.is_valid }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - id: check
        env:
          TITLE: ${{ github.event.issue.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          PATTERN="^(bug|chore|feature)\((frontend|backend|sdk|testing)\): .+"
          if [[ "$TITLE" =~ $PATTERN ]]; then
            echo "is_valid=true" >> $GITHUB_OUTPUT
          else
            echo "is_valid=false" >> $GITHUB_OUTPUT
            gh issue comment $ISSUE_NUM --body "⚠️ **Issue Title Format Error**\n\nYour issue title must follow: \`<type>(<area>): <title contents>\`\n- **Types:** bug, chore, feature\n- **Areas:** frontend, backend, sdk, testing"
          fi
          