name: AI Issue Quality Analyzer
on:
  issues:
    types: [opened]

env:
  TARGET_MODEL: "openai/gpt-5"

jobs:
  analyze-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      models: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install openai

      - name: Execute AI Issue Triage
        id: ai_logic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.issue.title }}
          RAW_BODY: ${{ github.event.issue.body }}
          TARGET_MODEL: ${{ env.TARGET_MODEL }}
        run: python .github/scripts/ai_triage.py

      - name: Apply Quality Analysis Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPORT: ${{ steps.ai_logic.outputs.analysis }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "## 🤖 AI Issue Quality Review
          $REPORT"

